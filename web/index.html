<script>
/* PLATFORM DECISION + KIT SELECTION. Inline, in <head>, and ABOVE the app stylesheet — all three
   deliberately. It has to run before first paint (a kit swapped in afterwards is a visible flash),
   and its <link>s have to land AHEAD of app.css in the cascade, since app.css overrides the kit.
   `document.write` rather than head.appendChild for exactly that second reason: it inserts at this
   script's own position in the source, so the kit stays ahead of app.css however this file is
   later reordered. There is no build step to resolve this at package time.
   Detection order: an explicit ?platform= — browser design mode, and the ONLY way the Windows or
   Linux skin can be reviewed from a Mac — then the real user agent. Python gets no vote: it can
   inject only after load, which is far too late to choose a stylesheet. js/core/platform.js reads
   the result back off <html data-platform> so look and behaviour cannot disagree.
   "linux" loads adwaita-kit — a PLACEHOLDER kit (not sourced from libadwaita the way win11-kit was
   sourced from WinUI 3; see adwaita-kit/README.md), picked over silently falling through to "mac"
   (the previous behaviour here) so a real Linux user agent stops loading macOS's traffic lights and
   glass toolbar with no native chrome behind them. */
(function(){
  var q=/[?&]platform=(mac|win|linux)\b/.exec(location.search);
  var ua=(navigator.userAgentData&&navigator.userAgentData.platform)||navigator.platform||"";
  var p=q?q[1]:(/win/i.test(ua)?"win":/linux/i.test(ua)?"linux":"mac");
  document.documentElement.dataset.platform=p;
  var kit=p==="win"?["win11-kit/fluent-tokens.css","win11-kit/fluent-chrome.css"]
         :p==="linux"?["adwaita-kit/adwaita-tokens.css","adwaita-kit/adwaita-chrome.css"]
                     :["macos-kit/mac-tokens.css","macos-kit/mac-chrome.css"];
  for(var i=0;i<kit.length;i++) document.write('<link rel="stylesheet" href="'+kit[i]+'">');
})();
</script>

    <!-- LINEAR-LIGHT DROP SHADOWS. CSS `box-shadow` composites in gamma-encoded sRGB; Figma and CoreGraphics
         composite in linear light, which is why the same numbers (0 8 40 / black 12 %) read tighter and harder in
         a browser than in the mock. An SVG filter is the one surface in CSS whose compositing space is
         addressable — `color-interpolation-filters` defaults to linearRGB and is stated here explicitly on every
         filter below (not left to the default) — so several genuine drop shadows in the app are drawn through one
         of these instead of `box-shadow`, applied via CSS `filter:url(#…)`.
         NOT (any longer) drawn this way: the titlebar pill shadow (`.tbpill`, mac-chrome.css) — it shipped as
         `#lgShadow`/`#lgShadowDark` filters here too, on the same linear-light-is-more-correct theory, but a live
         side-by-side found the linear-light version too faint at the LG kit's documented 12 %-opacity value where
         plain sRGB box-shadow read correctly. Reverted to `box-shadow:var(--lg-button-shadow)` (see that token's
         COMPOSITING HISTORY comment in mac-tokens.css) and the two now-unused filters deleted from here — if you
         go looking for `#lgShadow`, it no longer exists; don't recreate it without a fresh side-by-side.
         stdDeviation = the CSS blur radius ÷ 2, which is the relationship between a CSS shadow's blur length and a
         Gaussian's sigma — every filter below was derived from its box-shadow twin by that one rule, offset and
         flood-opacity carried over unchanged.
         The filter REGION is opened to 500 % about the box (200 % margin on every side) on every one of these —
         MEASURED, not guessed, after a real bug: the button/pill shadow first shipped here at only a 200 %/50 %-
         margin region (the SVG default is tighter still, -10 %/+120 %), and at LOW opacity (12 %) the clip was
         invisible. Darkening that same shadow to 30 % opacity for the "not dark enough" fix made the clip visible
         for the first time — the fade visibly STOPPED partway through and jumped straight to nothing, a hard
         "shelf" a few px past the pill, which read as a second, separate shadow edge stacked under the real one
         ("the shadow looks doubled"). It was never two shadows or two rules; it was one shadow cut off before it
         finished fading. A feDropShadow needs roughly (offset + 3–4×stdDeviation) of clear region past the shape
         to fade out cleanly — for THIS shadow (dy 10, stdDeviation 14) that is ~66px, which is *more* than the
         ~36px tall single-icon pill this paints on even at a 100 % margin, so 100 % (the previous 200 %-width
         figure) was never enough; 200 % margin (~72–80px on the smallest hosts here) clears every filter defined
         below with room to spare, including the largest, the dialog shadow's ~62px requirement. Confirmed by
         re-measuring the same vertical black|white edge profile this file's other measurements use: the fade now
         reaches flat within the region on every filter, no shelf, at every opacity used below.
         NOT converted: (1) three kinds of INSET box-shadow — rim/edge specular highlights (a filter cannot express
         an inset), focus rings (0 0 0 Npx, a hard-edged glow that is not a "cast shadow"), and the grid's
         bottom-rule/dropzone hairlines (border substitutes, not shadows) — all stay `box-shadow`, unconverted, on
         purpose; (2) a `0 0 0 Npx` SPREAD-only layer bundled inside an otherwise-real shadow token (the pill/menu
         shadow's trailing hairline) — feDropShadow has no spread parameter, spread is a hard-edged offset-outline
         effect a Gaussian blur cannot fake, so that one component STAYS box-shadow alongside the filter that
         carries the token's real blur layers (search `-hairline` below); (3) `.dg-ghost` (the diagram drag-ghost
         badge) and `.oreportbox` (the reported-speech subtree backdrop) — left as box-shadow deliberately: a drag
         ghost's position updates every pointermove and a reported-speech box can appear many times over in one
         diagram render, and `filter:url(#…)` opens a new stacking context per element, which is a real compositing
         cost `box-shadow` doesn't carry — untested against either of those hot paths, so not worth the risk for a
         barely-visible shadow; (4) the browser-mockup window card's shadow (`--shadow`, `html.mockup .window`) —
         its box-shadow uses a NEGATIVE spread ("0 22px 60px -12px"), which feDropShadow has no way to express at
         all (spread shrinks the shadow's source shape before blurring; a drop-shadow filter blurs the shape
         as-is), and mockup mode is a browser dev-preview only — the shipped native app has a real AppKit window
         shadow and never renders this element, so there is no user-facing payoff for solving the spread problem. -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;pointer-events:none">
      <!-- --lg-menu-shadow (context/status-bar menus, popovers, drawers): "0 0 2px black 10%, 0 0 25px black 16%".
           No dark override exists on the source token (it is the Apple LG-kit exact value in both appearances), so
           ONE filter serves both themes, same as the token itself does. -->
      <filter id="lgMenuShadow" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="linearRGB">
        <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#000" flood-opacity="0.1" result="a"/>
        <feDropShadow in="a" dx="0" dy="0" stdDeviation="12.5" flood-color="#000" flood-opacity="0.16"/>
      </filter>
      <!-- --lg-dialog-shadow (alerts/sheets, .sheet): "0 0 0.5px black 20%, 0 17px 22.5px black 50%". Also no dark
           override on the source token. -->
      <filter id="lgDialogShadow" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="linearRGB">
        <feDropShadow dx="0" dy="0" stdDeviation="0.25" flood-color="#000" flood-opacity="0.2" result="a"/>
        <feDropShadow in="a" dx="0" dy="17" stdDeviation="11.25" flood-color="#000" flood-opacity="0.5"/>
      </filter>
      <!-- --menu-shadow (.findbar's own halo, distinct token from --lg-menu-shadow above): light "0 8px 28px black
           20%", dark "0 8px 28px black 55%" — only the blur/offset layer; the token's trailing "0 0 0 .5px" hairline
           has no blur to convert and stays a companion box-shadow (--menu-hairline, mac-tokens.css). -->
      <filter id="menuShadow" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="linearRGB">
        <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.20"/>
      </filter>
      <filter id="menuShadowDark" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="linearRGB">
        <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
      </filter>
      <!-- --pill-shadow (toolbar search field + native popup-button/select.sel): light "0 6px 16px black 9%, 0 2px
           5px black 5%", dark "0 6px 18px black 44%, 0 2px 6px black 30%" — again only the two blur layers; the
           token's trailing "0 0 0 .5px" hairline stays a companion box-shadow (--pill-hairline). -->
      <filter id="pillShadow" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="linearRGB">
        <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.09" result="a"/>
        <feDropShadow in="a" dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.05"/>
      </filter>
      <filter id="pillShadowDark" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="linearRGB">
        <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.44" result="a"/>
        <feDropShadow in="a" dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.30"/>
      </filter>
      <!-- --edit-shadow (a grid cell's pop-out editing overlay, .cin.editing/.csel.editing): light "0 3px 12px
           black 18%", dark "0 3px 14px black 50%". Only one cell can be mid-edit at a time, so this is cheap. -->
      <filter id="editShadow" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="linearRGB">
        <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
      </filter>
      <filter id="editShadowDark" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="linearRGB">
        <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000" flood-opacity="0.5"/>
      </filter>
      <!-- .drawer-btn's own small drop ("0 .5px 1.5px black 10%", theme-invariant — no dark override existed on
           the literal either). -->
      <filter id="drawerBtnShadow" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="linearRGB">
        <feDropShadow dx="0" dy="0.5" stdDeviation="0.75" flood-color="#000" flood-opacity="0.10"/>
      </filter>
      <!-- .toast ("0 10px 30px black 35%") — the toast chip is the same near-black translucent fill in both
           themes, so one filter covers both. -->
      <filter id="toastShadow" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="linearRGB">
        <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.35"/>
      </filter>
    </svg>

      <span class="pill"><b id="sentCount">0</b> sentences</span>
      <span class="pill"><b id="tokCount">0</b> tokens</span>
      <span class="pill busyind" id="statusBusy" hidden><span class="spin"></span><span class="prog"><i></i></span><span id="busyText"></span></span>
      <span class="spring" style="flex:1"></span>
      <!-- The four status-bar controls below all open a menu on click (format conversion, language picker,
           script picker, transliteration picker), so they share ONE outline treatment (.fmtpill, despite the
           name — kept rather than renamed so the single shared rule in app.css is an unambiguous grep target)
           and one disclosure chevron (.pillchev, the app's own hand-drawn SF-style chevron.down — see
           .drawer-btn's identical SVG in app.css for why this isn't a "▾"/"⌄" text glyph). Each wraps its
           dynamic label in its own inner span so the JS that rewrites the text on every state change can
           target the label alone and leave the trailing chevron svg untouched. -->
      <button class="pill mono fmtpill" id="fmtPill" title="Document format — click to convert, import UD, or export UD"><span id="fmtPillLabel">Format: SUD</span><svg class="pillchev" viewBox="0 0 10 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4 4-4"/></svg></button>
      <span class="pill fmtpill" id="tokInfo"><span id="tokInfoLabel">tokeniser: whitespace</span><svg class="pillchev" viewBox="0 0 10 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4 4-4"/></svg></span>
      <span class="pill fmtpill" id="orthoPill" hidden title="Script — re-render the token glyphs in a writing system"><span id="orthoPillLabel"></span><svg class="pillchev" viewBox="0 0 10 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4 4-4"/></svg></span>
      <!-- ONE transliteration pill: its menu carries Displayed and Stored as two columns of radio buttons. They were two pills with two near-identical menus, which put the same scheme list on screen twice and gave no way to see the two choices against each other. -->
      <span class="pill fmtpill" id="translitPill" hidden title="Transliteration — displayed row and stored Misc value"><span id="translitPillLabel"></span><svg class="pillchev" viewBox="0 0 10 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4 4-4"/></svg></span>
      <span class="pill">UTF‑8 · LF</span>
    </div>
  </div>

  <div class="scrim confirmscrim" id="confirmScrim"><div id="confirmHost"></div></div>
</div>
